<header class="topbar" id="top">
  <div class="topbar__inner">
    <a class="brand" href="#top" [attr.aria-label]="profile.name">{{ profile.initials }}</a>

    <nav class="nav" aria-label="Menu">
      @for (link of links; track link.href) {
        <a class="nav__link" [href]="link.href">{{ i18n.t(link.key) }}</a>
      }
    </nav>

    <div class="controls">
      <div class="seg" role="group" [attr.aria-label]="i18n.t('lang.label')">
        @for (l of i18n.languages; track l.code) {
          <button
            type="button"
            class="seg__btn"
            [attr.lang]="l.code"
            [attr.aria-pressed]="i18n.lang() === l.code"
            [attr.title]="l.label"
            (click)="i18n.lang.set(l.code)">{{ l.code }}</button>
        }
      </div>

      <button
        type="button"
        class="icon-btn"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.theme() === 'dark' ? i18n.t('theme.toLight') : i18n.t('theme.toDark')"
        [attr.title]="theme.theme() === 'dark' ? i18n.t('theme.toLight') : i18n.t('theme.toDark')">
        @if (theme.theme() === 'dark') {
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></svg>
        } @else {
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1Z"/></svg>
        }
      </button>
    </div>
  </div>
</header>
